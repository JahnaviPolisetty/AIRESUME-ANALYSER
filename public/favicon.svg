<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Slate background definition -->
  <defs>
    <linearGradient id="reactBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect width="100" height="100" rx="24" fill="url(#reactBg)" />

  <!-- React Atomic Symbol Orbitals -->
  <g stroke="#61dafb" stroke-width="4">
    <ellipse cx="50" cy="50" rx="38" ry="14.5" transform="rotate(0 50 50)" />
    <ellipse cx="50" cy="50" rx="38" ry="14.5" transform="rotate(60 50 50)" />
    <ellipse cx="50" cy="50" rx="38" ry="14.5" transform="rotate(120 50 50)" />
  </g>
  
  <!-- Core -->
  <circle cx="50" cy="50" r="6" fill="#61dafb" />
</svg>
